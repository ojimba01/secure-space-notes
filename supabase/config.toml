project_id = "gotwcbjywtdlyrtfjqnw"

[functions.compliance-cron]
verify_jwt = false

# Called by the "Send to Case Notes" button in the Housing Case Management
# workbook. Google Apps Script cannot present a Supabase JWT, so the function
# authenticates on a shared secret it checks itself.
[functions.sheet-intake]
verify_jwt = false

# Sends one completed form to an MCO. Called by a signed-in case manager from
# the app, so Supabase checks the JWT before it runs and the function then
# lets row level security decide whether that person may send that form.
[functions.fax-send]
verify_jwt = true

# HumbleFax posts delivery results here. A fax service cannot present a
# Supabase JWT, so the function authenticates on a shared secret of its own,
# passed as ?token= on the registered webhook URL.
[functions.fax-status]
verify_jwt = false
