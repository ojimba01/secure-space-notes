project_id = "gotwcbjywtdlyrtfjqnw"

[functions.compliance-cron]
verify_jwt = false

# Called by the "Send to Case Notes" button in the Housing Case Management
# workbook. Google Apps Script cannot present a Supabase JWT, so the function
# authenticates on a shared secret it checks itself.
[functions.sheet-intake]
verify_jwt = false

# The per-person calendar subscription feed. A calendar app fetching a URL on a
# schedule cannot present a Supabase JWT, so the function authenticates on the
# per-person token in the query string and hands back only that person's events.
[functions.calendar-feed]
verify_jwt = false

# The scheduled document reader. pg_cron calls it, and pg_cron cannot present
# a user's JWT. It reads only what is already queued and answers with counts,
# so reaching it can move the queue along and tells nobody anything.
[functions.document-reader]
verify_jwt = false
